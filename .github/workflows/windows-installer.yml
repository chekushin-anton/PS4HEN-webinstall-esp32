name: Build standalone ESP32-S3 installers

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-installer/**"
      - "docs/firmware/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check firmware files
        shell: pwsh
        run: |
          $required = @("docs/firmware/bootloader.bin", "docs/firmware/partitions.bin", "docs/firmware/boot_app0.bin", "docs/firmware/firmware.bin", "docs/firmware/spiffs.bin")
          foreach ($file in $required) { if (!(Test-Path $file)) { throw "Required firmware file missing: $file" } }
      - name: Prepare firmware
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-installer/firmware | Out-Null
          Copy-Item docs/firmware/*.bin windows-installer/firmware/
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller esptool==4.8.1 pyserial
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PS4HEN_ESP32S3_Installer --collect-all esptool --collect-all serial --add-data "windows-installer/firmware;firmware" windows-installer/installer.py
          if (!(Test-Path "dist/PS4HEN_ESP32S3_Installer.exe")) { throw "PyInstaller did not produce the EXE" }
      - name: Package Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-win | Out-Null
          Copy-Item dist/PS4HEN_ESP32S3_Installer.exe release-win/
          @"
          PS4HEN ESP32-S3 Installer for Windows

          1. Connect the ESP32-S3 board using a USB data cable.
          2. Run PS4HEN_ESP32S3_Installer.exe.
          3. Select the board's COM port and click "Прошить ESP32-S3".
          4. Confirm the flash overwrite and wait for completion.

          No Arduino IDE or internet connection is required during installation.
          Target: ESP32-S3 with 16 MB flash and the layout used by this repository.
          Flash contents will be overwritten.
          "@ | Set-Content -Encoding UTF8 release-win/README.txt
          Get-FileHash release-win/PS4HEN_ESP32S3_Installer.exe -Algorithm SHA256 | Format-List | Out-String | Set-Content -Encoding ASCII release-win/SHA256.txt
          Compress-Archive -Path release-win/* -DestinationPath PS4HEN_ESP32S3_Windows_Standalone.zip -Force
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/PS4HEN_ESP32S3_Installer.exe
            PS4HEN_ESP32S3_Windows_Standalone.zip
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS (${{ matrix.arch_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch_label: Apple-Silicon
            asset_suffix: AppleSilicon
          - runner: macos-15-intel
            arch_label: Intel
            asset_suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check firmware files
        run: |
          for file in docs/firmware/bootloader.bin docs/firmware/partitions.bin docs/firmware/boot_app0.bin docs/firmware/firmware.bin docs/firmware/spiffs.bin; do
            test -f "$file" || { echo "Missing firmware file: $file"; exit 1; }
          done
      - name: Prepare firmware
        run: |
          mkdir -p windows-installer/firmware
          cp docs/firmware/*.bin windows-installer/firmware/
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller esptool==4.8.1 pyserial
      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed --name PS4HEN_ESP32S3_Installer --collect-all esptool --collect-all serial --add-data "windows-installer/firmware:firmware" windows-installer/installer.py
          test -d "dist/PS4HEN_ESP32S3_Installer.app"
      - name: Package DMG and ZIP
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          mkdir -p "stage/PS4HEN ESP32-S3 Installer"
          cp -R "dist/PS4HEN_ESP32S3_Installer.app" "stage/PS4HEN ESP32-S3 Installer/"
          cat > "stage/PS4HEN ESP32-S3 Installer/README.txt" <<'EOF'
          PS4HEN ESP32-S3 Installer for macOS

          1. Open the downloaded DMG and drag the app to Applications or another folder.
          2. Connect the ESP32-S3 board with a USB data cable.
          3. Launch PS4HEN_ESP32S3_Installer.app.
          4. Select the serial port and click "Прошить ESP32-S3".
          5. Confirm the flash overwrite and wait until the app reports success.

          No Arduino IDE or internet connection is required during installation.
          Target: ESP32-S3 with 16 MB flash and the layout used by this repository.
          Flash contents will be overwritten.

          This app is not signed or notarized. On first launch, macOS may show a security
          warning. Only open it if you trust the source and have verified the release.
          EOF
          APP_ZIP="PS4HEN_ESP32S3_macOS_${ASSET_SUFFIX}.zip"
          DMG="PS4HEN_ESP32S3_macOS_${ASSET_SUFFIX}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "dist/PS4HEN_ESP32S3_Installer.app" "$APP_ZIP"
          hdiutil create -volname "PS4HEN ESP32-S3 Installer" -srcfolder "stage/PS4HEN ESP32-S3 Installer" -ov -format UDZO "$DMG"
          shasum -a 256 "$APP_ZIP" "$DMG" > "SHA256_${ASSET_SUFFIX}.txt"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.asset_suffix }}
          path: |
            PS4HEN_ESP32S3_macOS_${{ matrix.asset_suffix }}.zip
            PS4HEN_ESP32S3_macOS_${{ matrix.asset_suffix }}.dmg
            SHA256_${{ matrix.asset_suffix }}.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push'
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows
      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer-AppleSilicon
          path: release-assets/apple-silicon
      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer-Intel
          path: release-assets/intel
      - name: Flatten release assets
        run: |
          mkdir -p release-flat
          find release-assets -type f -exec cp {} release-flat/ \;
          ls -la release-flat
      - name: Publish GitHub Release v0.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: PS4HEN ESP32-S3 Installer v0.2.0
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-flat/PS4HEN_ESP32S3_Installer.exe
            release-flat/PS4HEN_ESP32S3_Windows_Standalone.zip
            release-flat/PS4HEN_ESP32S3_macOS_AppleSilicon.zip
            release-flat/PS4HEN_ESP32S3_macOS_AppleSilicon.dmg
            release-flat/SHA256_AppleSilicon.txt
            release-flat/PS4HEN_ESP32S3_macOS_Intel.zip
            release-flat/PS4HEN_ESP32S3_macOS_Intel.dmg
            release-flat/SHA256_Intel.txt
          body: |
            ## PS4HEN ESP32-S3 Installer v0.2.0

            Автономный установщик подготовленной прошивки этого репозитория для ESP32-S3 с Flash 16 МБ.

            ### Загрузки
            - Windows: EXE или ZIP-комплект.
            - macOS Apple Silicon (M1/M2/M3/M4 и совместимые): DMG или ZIP.
            - macOS Intel: отдельные DMG и ZIP для Intel Mac.

            ### Как использовать на macOS
            1. Скачайте DMG для архитектуры вашего Mac: Apple Silicon или Intel.
            2. Откройте DMG и скопируйте приложение в Applications или другую папку.
            3. Подключите ESP32-S3 USB-кабелем с передачей данных.
            4. Запустите приложение, выберите последовательный порт и нажмите «Прошить ESP32-S3».
            5. Подтвердите перезапись Flash и дождитесь сообщения об успехе.
            6. Если порт не виден, нажмите «Обновить», проверьте кабель/драйвер USB-UART и при необходимости переведите плату в режим загрузки кнопками BOOT/RESET.

            ### Важно
            - Только ESP32-S3 с Flash 16 МБ и разметкой, соответствующей файлам этой сборки.
            - Не предназначено для обычного ESP32 или ESP32-C3.
            - Прошивка перезаписывает Flash и может удалить данные.
            - macOS-приложение пока не подписано и не нотариализировано Apple, поэтому Gatekeeper может показать предупреждение при первом запуске.
            - Сборка и упаковка выполняются в GitHub Actions; совместимость на конкретной плате следует проверить перед массовым использованием.
