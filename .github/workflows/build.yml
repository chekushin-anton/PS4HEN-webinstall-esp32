name: Build ESP32-S3 Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install mklittlefs
        run: |
          wget https://github.com/earlephilhower/mklittlefs/releases/download/4.0.2/x86_64-linux-gnu-mklittlefs-db0513a.tar.gz -O mklittlefs.tar.gz
          tar -xzf mklittlefs.tar.gz
          sudo mv mklittlefs /usr/local/bin/

      - name: Create partitions.csv
        run: |
          set -e
          SKETCH="ESP32-S3-LittleFS-WebServer"
          cat > "$SKETCH/partitions.csv" <<'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x5000,
          otadata,  data, ota,     0xe000,  0x2000,
          app0,     app,  ota_0,   0x10000, 0x200000,
          app1,     app,  ota_1,   0x210000,0x200000,
          spiffs,   data, spiffs,  0x410000,0xBE0000,
          coredump, data, coredump,0xFF0000,0x10000,
          EOF

          echo "=== Generated partitions.csv ==="
          cat "$SKETCH/partitions.csv"
          echo "=== First two bytes (should NOT be 'PK') ==="
          head -c 2 "$SKETCH/partitions.csv" | xxd

      - name: Build firmware
        run: |
          set -e
          SKETCH="ESP32-S3-LittleFS-WebServer"
          mkdir -p flasher/firmware flasher/manifests
          EXPLOITS="505 672 700 900 1352"

          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=custom,CDCOnBoot=default \
            --output-dir ./build "$SKETCH"

          cp build/*.bootloader.bin flasher/firmware/bootloader.bin
          cp build/*.partitions.bin flasher/firmware/partitions.bin
          cp build/*.ino.bin        flasher/firmware/firmware.bin
          find ~/.arduino15 -name "boot_app0.bin" -exec cp {} flasher/firmware/ \;

          # «Все эксплойты»
          mklittlefs -c data -s 0xBE0000 -p 256 -b 4096 flasher/firmware/spiffs-all.bin

          # Каждый эксплойт отдельно
          for e in $EXPLOITS; do
            rm -rf staging && mkdir -p staging/ran
            cp -r data/index.html data/style.css staging/ 2>/dev/null || true
            cp -r data/ran/index.html data/ran/css data/ran/shared staging/ran/ 2>/dev/null || true
            cp -r data/ran/$e staging/ran/
            mklittlefs -c staging -s 0xBE0000 -p 256 -b 4096 flasher/firmware/spiffs-$e.bin
          done

          echo "=== flasher/firmware ==="
          ls -la flasher/firmware

      - name: Generate manifests
        run: |
          set -e
          EXPLOITS="505 672 700 900 1352"

          gen() {
            local fw=$1 spiffs=$2
            local name="PS4 HEN — ESP32-S3 — FW ${fw}"
            [ "$fw" = "all" ] && name="PS4 HEN — ESP32-S3 — все эксплойты"
            cat > flasher/manifests/s3-${fw}.json <<EOF
          {
            "name": "${name}",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "../firmware/bootloader.bin", "offset": 0 },
                  { "path": "../firmware/partitions.bin", "offset": 32768 },
                  { "path": "../firmware/boot_app0.bin",  "offset": 57344 },
                  { "path": "../firmware/firmware.bin",   "offset": 65536 },
                  { "path": "../firmware/${spiffs}",      "offset": 4259840 }
                ]
              }
            ]
          }
          EOF
          }

          gen all "spiffs-all.bin"
          for e in $EXPLOITS; do gen $e "spiffs-$e.bin"; done

          echo "=== Manifests ==="
          ls -la flasher/manifests/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flasher
          publish_branch: gh-pages
          force_orphan: true