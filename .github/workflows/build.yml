name: Build ESP32-S3 Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=custom,CDCOnBoot=disabled \
            --output-dir ./build \
            ESP32-S3-LittleFS-WebServer

      - name: Install mklittlefs
        run: |
          wget https://github.com/earlephilhower/mklittlefs/releases/download/4.0.0/mklittlefs-4.0.0-x86_64-linux-gnu.tar.gz
          tar -xzf mklittlefs-4.0.0-x86_64-linux-gnu.tar.gz
          sudo mv mklittlefs /usr/local/bin/

      - name: Build LittleFS image
        run: |
          mklittlefs \
            -c ESP32-S3-LittleFS-WebServer/data \
            -s 0xBE0000 \
            -p 256 \
            -b 4096 \
            spiffs.bin
          ls -la spiffs.bin

      - name: Prepare flasher files
        run: |
          mkdir -p flasher/firmware
          cp build/*.bootloader.bin flasher/firmware/bootloader.bin
          cp build/*.partitions.bin flasher/firmware/partitions.bin
          cp build/*.ino.bin       flasher/firmware/firmware.bin
          find ~/.arduino15 -name "boot_app0.bin" -exec cp {} flasher/firmware/ \; || \
            find /home/runner -name "boot_app0.bin" -exec cp {} flasher/firmware/ \;
          cp spiffs.bin flasher/firmware/spiffs.bin
          echo "=== flasher/firmware ==="
          ls -la flasher/firmware

      - name: Verify partitions.csv contains spiffs
        run: |
          if grep -q "^spiffs," ESP32-S3-LittleFS-WebServer/partitions.csv; then
            echo "OK: partition 'spiffs' found"
          else
            echo "ERROR: 'spiffs' partition missing in partitions.csv"
            cat ESP32-S3-LittleFS-WebServer/partitions.csv
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flasher
          publish_branch: gh-pages
          force_orphan: true